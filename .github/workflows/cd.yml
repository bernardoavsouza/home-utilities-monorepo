name: CD

# One job per stage, chained with `needs:`, so the Actions run page draws the
# pipeline as a graph instead of one opaque box.
#
# The two apps ship on independent tracks that fan out from `resolve` and join
# again at `release`:
#
#   resolve ┬─ image → migrate → deploy-api → verify-api ─┬─ release
#           └─ deploy-web → verify-web ──────────────┘
#
# Inside the API track the order is still load-bearing: the database is migrated
# before the API rolls, and the rollout is proven `live` before the API is
# smoked. The web track carries no dependency on the API track on purpose —
# Vercel builds from source, and `NEXT_PUBLIC_API_URL` points at a stable Render
# URL rather than at anything this run produces.
#
# The parallelism buys a trade, and it is a real one: while the API is still
# rolling, the new web already serves against the *previous* API, so a tag that
# changes the HTTP contract is visible to users for the length of the Render
# rollout. Releases have to keep the contract back-compatible; a release that
# cannot must re-serialize the tracks by giving `deploy-web` a `needs:
# verify-api` again.
#
# `release` is the join. Every stage already fails closed on its own; this job is
# the single node that cannot go green unless both tracks did, so it is the one
# thing to look at to know whether a tag actually shipped.
#
# Every stage that reads a deploy secret declares `environment: production`,
# because that is where those secrets live. A job that omits it does not fail:
# GitHub resolves `secrets.X` to an empty string and the step runs with a blank
# value, which surfaces far downstream as a confusing error from whatever
# consumed it.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing git tag to redeploy (e.g. v1.2.3). Required for dispatch.
        required: true
        type: string

concurrency:
  group: cd-${{ github.workflow }}-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/bernardoavsouza/home-utilities-api

jobs:
  resolve:
    name: 1 · Resolve tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      commit: ${{ steps.meta.outputs.commit }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image_sha: ${{ steps.meta.outputs.image_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: meta
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          case "$TAG" in
            v*) ;;
            *)
              echo "::error::Tag must match v* (got: $TAG)"
              exit 1
              ;;
          esac
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            git fetch origin "refs/tags/$TAG:refs/tags/$TAG"
          fi
          COMMIT="$(git rev-list -n 1 "$TAG")"
          SHORT_SHA="$(git rev-parse --short=7 "$COMMIT")"
          {
            echo "tag=$TAG"
            echo "commit=$COMMIT"
            echo "short_sha=$SHORT_SHA"
            echo "image_tag=${IMAGE_NAME}:$TAG"
            echo "image_sha=${IMAGE_NAME}:sha-$SHORT_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Assert tag commit is on origin/main
        run: |
          set -euo pipefail
          git fetch origin main
          if ! git merge-base --is-ancestor "${{ steps.meta.outputs.commit }}" origin/main; then
            echo "::error::Commit ${{ steps.meta.outputs.commit }} (tag ${{ steps.meta.outputs.tag }}) is not on origin/main"
            exit 1
          fi

      - name: Summary
        run: |
          {
            echo "### Deploying \`${{ steps.meta.outputs.tag }}\`"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| commit | \`${{ steps.meta.outputs.short_sha }}\` |"
            echo "| image | \`${{ steps.meta.outputs.image_tag }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  image:
    name: API 1 · Build & push image
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ needs.resolve.outputs.image_tag }}
            ${{ needs.resolve.outputs.image_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  migrate:
    name: API 2 · Migrate database
    needs: [resolve, image]
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Migrations run from the image that is about to ship, never as the
      # container CMD — N containers starting at once must not race the schema.
      - name: Prisma migrate deploy
        run: |
          set -euo pipefail
          docker run --rm \
            -e DATABASE_URL \
            "${{ needs.resolve.outputs.image_tag }}" \
            ./node_modules/.bin/prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  deploy-api:
    name: API 3 · Deploy (Render)
    needs: [resolve, migrate]
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 40
    steps:
      # The hook answers with the deploy it just created. That id is the only
      # thing that makes the rollout observable — without it this step is
      # fire-and-forget and a failed rollout looks identical to a healthy one.
      - name: Trigger Render deploy
        id: hook
        run: |
          set -euo pipefail
          IMAGE_URL="${{ needs.resolve.outputs.image_tag }}"
          HOOK="${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

          # Read the service id before any request: the id is a path segment of
          # the hook URL, so a malformed hook should fail here by name rather
          # than downstream as an opaque HTTP error.
          SERVICE_ID="$(printf '%s' "$HOOK" | sed -n 's#.*/deploy/\(srv-[A-Za-z0-9]*\).*#\1#p')"
          if [ -z "$SERVICE_ID" ]; then
            echo "::error::Could not read the service id (srv-...) out of RENDER_DEPLOY_HOOK_URL"
            exit 1
          fi

          # Describe the service before deploying to it. `imgURL` is only
          # meaningful for an image-backed service; pointed at a repo-backed one
          # the hook refuses with a bare 400 that reads like a broken URL. This
          # is reported, not enforced: the hook stays the authority on what it
          # accepts, and a wrong guess here must not block a working setup.
          # The HTTP status is read, not discarded: `jq` exits 0 on an error
          # payload as happily as on a service, and on empty input it exits 0
          # printing nothing — so a `|| echo` fallback never fires and a 401
          # renders as `type=?`, indistinguishable from a genuinely repo-backed
          # service. The hint at the bottom of the failure summary would then
          # send the reader off to re-create a service that was fine.
          SVC_BODY="$(mktemp)"
          SVC_CODE="$(curl -sS -o "$SVC_BODY" -w '%{http_code}' \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            "https://api.render.com/v1/services/${SERVICE_ID}" 2>/dev/null || true)"
          SVC_DESC=""
          case "$SVC_CODE" in
            2*)
              # A present `.type` is the proof this is a service and not an
              # error payload that happens to be valid JSON.
              if [ -n "$(jq -r '.type // empty' "$SVC_BODY" 2>/dev/null || true)" ]; then
                SVC_DESC="$(jq -r '"type=\(.type // "?") runtime=\(.serviceDetails.env // "?") image=\(.imageDetails.imagePath // "<none>") repo=\(.repo // "<none>")"' "$SVC_BODY" 2>/dev/null || true)"
              fi
              ;;
          esac
          SVC_DESC="${SVC_DESC:-could not describe service (HTTP ${SVC_CODE:-000})}"
          echo "Service ${SERVICE_ID}: ${SVC_DESC}"

          ENCODED="$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=""))' "$IMAGE_URL")"
          case "$HOOK" in
            *\?*) URL="${HOOK}&imgURL=${ENCODED}" ;;
            *) URL="${HOOK}?imgURL=${ENCODED}" ;;
          esac

          # Deliberately no `-f`: it makes curl exit non-zero and drop the body,
          # and the body is the only place Render says why it refused.
          BODY="$(mktemp)"
          # `|| true`, never `|| echo 000`: curl's `-w` already prints a status
          # and adds no trailing newline, so a fallback `echo` is glued onto it
          # instead of replacing it. A DNS failure would report `000000`, and a
          # transfer that dies after a good status would report `200000` — which
          # tests as `>= 300`, calling a deploy that Render *did* accept a
          # refusal and then never polling the rollout it just started.
          CODE="$(curl -sS -o "$BODY" -w '%{http_code}' -X POST "$URL" || true)"
          RESPONSE="$(cat "$BODY")"
          # curl prints nothing at all if it dies before write-out, and `[` on an
          # empty string is a bash error, not a failed comparison.
          case "$CODE" in
            ''|*[!0-9]*)
              echo "::error::curl returned no HTTP status for the deploy hook (got: '${CODE}')"
              exit 1
              ;;
          esac
          if [ "$CODE" -lt 200 ] || [ "$CODE" -ge 300 ]; then
            {
              echo "### API deploy failed — Render refused the deploy hook"
              echo
              echo "| | |"
              echo "|---|---|"
              echo "| HTTP | \`${CODE}\` |"
              echo "| service | \`${SERVICE_ID}\` — ${SVC_DESC} |"
              echo "| imgURL | \`${IMAGE_URL}\` |"
              echo
              echo "Render said:"
              echo
              echo '```'
              echo "${RESPONSE:-<empty body>}"
              echo '```'
              echo
              echo "A \`400\` with an image-backed \`imgURL\` usually means the service is not"
              echo "image-backed. The hook accepts \`imgURL\` only on a service created as"
              echo "*Deploy an existing image*."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Render deploy hook returned HTTP ${CODE}: ${RESPONSE:-<empty body>}"
            exit 1
          fi

          DEPLOY_ID="$(printf '%s' "$RESPONSE" | jq -r '.deploy.id // empty' 2>/dev/null || true)"
          if [ -z "$DEPLOY_ID" ]; then
            echo "::error::Render accepted the hook (HTTP ${CODE}) but returned no deploy id. Response: ${RESPONSE:-<empty body>}"
            exit 1
          fi

          {
            echo "deploy_id=$DEPLOY_ID"
            echo "service_id=$SERVICE_ID"
          } >> "$GITHUB_OUTPUT"
          echo "Queued Render deploy $DEPLOY_ID on $SERVICE_ID"

      - name: Wait for the deploy to go live
        id: rollout
        run: |
          set -euo pipefail
          API="https://api.render.com/v1/services/${{ steps.hook.outputs.service_id }}/deploys/${{ steps.hook.outputs.deploy_id }}"
          STATUS="unknown"
          i=1
          while [ "$i" -le 120 ]; do
            STATUS="$(curl -fsS \
              -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
              -H 'Accept: application/json' \
              "$API" | jq -r '.status // "unknown"')"
            case "$STATUS" in
              live)
                echo "status=live" >> "$GITHUB_OUTPUT"
                echo "Deploy is live after $i check(s)"
                exit 0
                ;;
              build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                echo "status=$STATUS" >> "$GITHUB_OUTPUT"
                echo "::error::Render deploy ended as '$STATUS' — the API did NOT roll out"
                exit 1
                ;;
              *)
                echo "check $i: $STATUS"
                ;;
            esac
            i=$((i + 1))
            sleep 15
          done
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "::error::Render deploy never reached 'live' (last status: $STATUS)"
          exit 1

      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### API rollout"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| deploy | \`${{ steps.hook.outputs.deploy_id }}\` |"
            echo "| service | \`${{ steps.hook.outputs.service_id }}\` |"
            echo "| status | **${{ steps.rollout.outputs.status || 'never started' }}** |"
          } >> "$GITHUB_STEP_SUMMARY"

  verify-api:
    name: API 4 · Verify
    needs: deploy-api
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      # Render already reported `live`; this proves the app answers, not just that
      # the container started.
      - name: Smoke health + ready
        run: |
          set -euo pipefail
          BASE="${{ secrets.RENDER_API_URL }}"
          BASE="${BASE%/}"
          smoke() {
            local path="$1"
            local i=1
            while [ "$i" -le 36 ]; do
              code="$(curl -sS -o /tmp/smoke-body -w '%{http_code}' "$BASE$path" || true)"
              if [ "$code" = "200" ]; then
                echo "OK $path ($code) after $i attempt(s)"
                return 0
              fi
              echo "attempt $i: $path → $code"
              i=$((i + 1))
              sleep 10
            done
            echo "::error::Smoke failed for $path"
            cat /tmp/smoke-body || true
            exit 1
          }
          smoke /v1/health
          smoke /v1/health/ready

  deploy-web:
    name: Web 1 · Deploy (Vercel)
    needs: resolve
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.commit }}

      # `package-manager-cache: false` is required: setup-node v5 reads the root
      # `packageManager` field on its own and shells out to `pnpm store path`,
      # and this job never installs pnpm.
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      # `Could not retrieve Project Settings` is one opaque line covering three
      # different mistakes: a token scoped to an account that cannot see the
      # project, a VERCEL_ORG_ID that is not the account owning it, and a
      # VERCEL_PROJECT_ID that does not exist under that account. The CLI never
      # says which, so the obvious move is to regenerate the token — which fixes
      # only one of the three. This step asks the REST API those questions
      # separately, so the failure names the secret to change.
      #
      # Nothing here prints a secret, and the masking is itself a signal: GitHub
      # replaces any secret value that reaches the log with `***`, so the account
      # id that renders masked is the one VERCEL_ORG_ID holds.
      - name: Preflight Vercel scope
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail

          # Prints the HTTP status; the body lands in $1. Deliberately no `-f`:
          # the body is the only place Vercel explains a refusal.
          req() {
            curl -sS -o "$1" -w '%{http_code}' \
              -H "Authorization: Bearer ${VERCEL_TOKEN}" \
              -H 'Accept: application/json' \
              "https://api.vercel.com$2" 2>/dev/null || true
          }

          # 1 · Is the token usable at all, and whose is it?
          CODE="$(req /tmp/vc-user /v2/user)"
          case "$CODE" in
            2*) ;;
            *)
              echo "::error::VERCEL_TOKEN is not usable (GET /v2/user → HTTP ${CODE:-000}). $(cat /tmp/vc-user 2>/dev/null)"
              exit 1
              ;;
          esac
          USER_ID="$(jq -r '.user.id // .id // "?"' /tmp/vc-user)"
          USER_NAME="$(jq -r '.user.username // .username // "?"' /tmp/vc-user)"
          echo "token belongs to user ${USER_NAME} (id ${USER_ID})"

          # A secret's *shape* is not the secret. Length and prefix are what
          # separate a wrong id from a right one pasted short, and neither is
          # recoverable from the other. Masking hides exactly the difference
          # that matters here, so it has to be described rather than printed.
          shape() {
            case "$1" in
              "$2"*) echo "starts with '$2', ${#1} chars" ;;
              *) echo "does NOT start with '$2', ${#1} chars" ;;
            esac
          }
          echo "VERCEL_ORG_ID: $(shape "$VERCEL_ORG_ID" team_)"
          echo "VERCEL_PROJECT_ID: $(shape "$VERCEL_PROJECT_ID" prj_)"

          # 2 · Which accounts can it reach, and how does each relate to the
          # configured one? A truncated paste and an unrelated id both fail the
          # same way against the API; only this comparison tells them apart.
          CODE="$(req /tmp/vc-teams '/v2/teams?limit=100')"
          echo "teams the token can see:"
          case "$CODE" in
            2*) ;;
            *) echo "  (could not list teams — HTTP ${CODE:-000})" ;;
          esac
          for T in $(jq -r '.teams[]?.id' /tmp/vc-teams 2>/dev/null); do
            if [ "$T" = "$VERCEL_ORG_ID" ]; then
              REL="matches VERCEL_ORG_ID exactly"
            elif [ "${T#"$VERCEL_ORG_ID"}" != "$T" ] && [ -n "$VERCEL_ORG_ID" ]; then
              # The missing tail is printed because it is the fix, and because
              # it is the one part masking cannot hide: the id is masked only
              # for containing VERCEL_ORG_ID, so the characters beyond it are
              # the only ones that survive — and alone they identify nothing.
              REL="VERCEL_ORG_ID is this id truncated — append '${T#"$VERCEL_ORG_ID"}' to it ($(( ${#T} - ${#VERCEL_ORG_ID} )) char(s) missing from the end)"
            else
              REL="unrelated to VERCEL_ORG_ID (${#T} chars vs ${#VERCEL_ORG_ID})"
            fi
            echo "  - team ${#T} chars — ${REL}"
            # What the token can actually see in there. A project whose id
            # renders `***` is the one VERCEL_PROJECT_ID already points at.
            if [ "$(req /tmp/vc-list "/v9/projects?teamId=${T}&limit=100")" = "200" ]; then
              jq -r '.projects[]? | "      · \(.name)  \(.id)"' /tmp/vc-list || true
            else
              echo "      (cannot list this team's projects with this token)"
            fi
          done

          # 3 · Does the project resolve under the configured account?
          CODE="$(req /tmp/vc-proj "/v9/projects/${VERCEL_PROJECT_ID}?teamId=${VERCEL_ORG_ID}")"
          case "$CODE" in
            2*)
              echo "project resolves: $(jq -r '.name // "?"' /tmp/vc-proj)"
              exit 0
              ;;
          esac
          echo "project did NOT resolve under VERCEL_ORG_ID (HTTP ${CODE:-000}): $(cat /tmp/vc-proj 2>/dev/null)"

          # 4 · Find the account that *does* own it, so the fix is a value the
          # reader can paste rather than a hunt through the dashboard.
          OWNER=""
          if [ "$(req /tmp/vc-try "/v9/projects/${VERCEL_PROJECT_ID}")" = "200" ]; then
            OWNER="the personal account ${USER_NAME} — set VERCEL_ORG_ID to ${USER_ID}"
          else
            for T in $(jq -r '.teams[]?.id' /tmp/vc-teams 2>/dev/null); do
              if [ "$(req /tmp/vc-try "/v9/projects/${VERCEL_PROJECT_ID}?teamId=${T}")" = "200" ]; then
                OWNER="a team the token can reach — set VERCEL_ORG_ID to ${T}"
                break
              fi
            done
          fi
          # Also to stdout: the step summary is not readable from `gh run view`,
          # and the conclusion is the whole point of the step.
          echo "owner search: ${OWNER:-not found under any account this token can reach}"

          {
            echo "### Web deploy failed — Vercel could not resolve the project"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| token | valid, belongs to \`${USER_NAME}\` |"
            echo "| project under \`VERCEL_ORG_ID\` | HTTP \`${CODE:-000}\` |"
            if [ -n "$OWNER" ]; then
              echo "| actually owned by | ${OWNER} |"
            else
              echo "| actually owned by | not found under any account this token can reach |"
            fi
            echo
            if [ -n "$OWNER" ]; then
              echo "\`VERCEL_PROJECT_ID\` is right, but \`VERCEL_ORG_ID\` points at the wrong account."
            else
              echo "Either \`VERCEL_PROJECT_ID\` is not a project id (it must look like \`prj_...\`,"
              echo "copied from Project → Settings → General → Project ID), or the token is scoped"
              echo "to an account that cannot see it. A token's *scope* is chosen when it is created"
              echo "and is separate from its access level — a full-access token scoped to your"
              echo "personal account still cannot read a team's projects."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Vercel could not resolve VERCEL_PROJECT_ID under VERCEL_ORG_ID (HTTP ${CODE:-000})"
          exit 1

      - name: Install Vercel CLI
        run: npm install --global vercel@41

      # Deployed from the repo root on purpose: the project's Root Directory
      # (apps/web) is applied on top of the uploaded source, and the pnpm
      # workspace needs the root lockfile and packages/ above apps/web.
      - name: Deploy Vercel (prod)
        run: |
          set -euo pipefail
          API_BASE="${{ secrets.RENDER_API_URL }}"
          API_BASE="${API_BASE%/}"
          export NEXT_PUBLIC_API_URL="${API_BASE}/v1"
          vercel deploy --prod --yes \
            --token="${{ secrets.VERCEL_TOKEN }}" \
            --build-env NEXT_PUBLIC_API_URL="$NEXT_PUBLIC_API_URL" \
            --env NEXT_PUBLIC_API_URL="$NEXT_PUBLIC_API_URL"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  verify-web:
    name: Web 2 · Verify
    needs: deploy-web
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - name: Smoke web home
        run: |
          set -euo pipefail
          WEB="${{ secrets.VERCEL_WEB_URL }}"
          WEB="${WEB%/}"
          i=1
          while [ "$i" -le 18 ]; do
            code="$(curl -sS -o /tmp/web-body -w '%{http_code}' "$WEB/" || true)"
            if [ "$code" = "200" ]; then
              echo "OK web home ($code) after $i attempt(s)"
              exit 0
            fi
            echo "attempt $i: web → $code"
            i=$((i + 1))
            sleep 10
          done
          echo "::error::Smoke failed for web home"
          cat /tmp/web-body || true
          exit 1

  release:
    name: Release · Both apps live
    needs: [resolve, verify-api, verify-web]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Reads no secret, so it declares no environment. Its only job is to be the
      # one node that means "both tracks shipped this tag".
      - name: Summary
        run: |
          {
            echo "### \`${{ needs.resolve.outputs.tag }}\` shipped"
            echo
            echo "| track | |"
            echo "|---|---|"
            echo "| API | image \`${{ needs.resolve.outputs.image_tag }}\` rolled out and smoked |"
            echo "| web | deployed from \`${{ needs.resolve.outputs.short_sha }}\` and smoked |"
          } >> "$GITHUB_STEP_SUMMARY"
