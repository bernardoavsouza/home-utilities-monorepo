name: CD

# One job per stage, chained with `needs:`, so the Actions run page draws the
# pipeline as a graph instead of one opaque box. The order is load-bearing: the
# database is migrated before the API rolls, the API is proven live before the web
# app is pointed at it, and each stage fails closed.
#
#   resolve → image → migrate → deploy-api → verify-api → deploy-web → verify-web
#
# Every stage from `migrate` on declares `environment: production`, because that
# is where the deploy secrets live. A job that omits it does not fail: GitHub
# resolves `secrets.X` to an empty string and the step runs with a blank value,
# which surfaces far downstream as a confusing error from whatever consumed it.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing git tag to redeploy (e.g. v1.2.3). Required for dispatch.
        required: true
        type: string

concurrency:
  group: cd-${{ github.workflow }}-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/bernardoavsouza/home-utilities-api

jobs:
  resolve:
    name: 1 · Resolve tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      commit: ${{ steps.meta.outputs.commit }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image_sha: ${{ steps.meta.outputs.image_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: meta
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          case "$TAG" in
            v*) ;;
            *)
              echo "::error::Tag must match v* (got: $TAG)"
              exit 1
              ;;
          esac
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            git fetch origin "refs/tags/$TAG:refs/tags/$TAG"
          fi
          COMMIT="$(git rev-list -n 1 "$TAG")"
          SHORT_SHA="$(git rev-parse --short=7 "$COMMIT")"
          {
            echo "tag=$TAG"
            echo "commit=$COMMIT"
            echo "short_sha=$SHORT_SHA"
            echo "image_tag=${IMAGE_NAME}:$TAG"
            echo "image_sha=${IMAGE_NAME}:sha-$SHORT_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Assert tag commit is on origin/main
        run: |
          set -euo pipefail
          git fetch origin main
          if ! git merge-base --is-ancestor "${{ steps.meta.outputs.commit }}" origin/main; then
            echo "::error::Commit ${{ steps.meta.outputs.commit }} (tag ${{ steps.meta.outputs.tag }}) is not on origin/main"
            exit 1
          fi

      - name: Summary
        run: |
          {
            echo "### Deploying \`${{ steps.meta.outputs.tag }}\`"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| commit | \`${{ steps.meta.outputs.short_sha }}\` |"
            echo "| image | \`${{ steps.meta.outputs.image_tag }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  image:
    name: 2 · Build & push API image
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ needs.resolve.outputs.image_tag }}
            ${{ needs.resolve.outputs.image_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  migrate:
    name: 3 · Migrate database
    needs: [resolve, image]
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Migrations run from the image that is about to ship, never as the
      # container CMD — N containers starting at once must not race the schema.
      - name: Prisma migrate deploy
        run: |
          set -euo pipefail
          docker run --rm \
            -e DATABASE_URL \
            "${{ needs.resolve.outputs.image_tag }}" \
            ./node_modules/.bin/prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  deploy-api:
    name: 4 · Deploy API (Render)
    needs: [resolve, migrate]
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 40
    steps:
      # The hook answers with the deploy it just created. That id is the only
      # thing that makes the rollout observable — without it this step is
      # fire-and-forget and a failed rollout looks identical to a healthy one.
      - name: Trigger Render deploy
        id: hook
        run: |
          set -euo pipefail
          IMAGE_URL="${{ needs.resolve.outputs.image_tag }}"
          HOOK="${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

          # Read the service id before any request: the id is a path segment of
          # the hook URL, so a malformed hook should fail here by name rather
          # than downstream as an opaque HTTP error.
          SERVICE_ID="$(printf '%s' "$HOOK" | sed -n 's#.*/deploy/\(srv-[A-Za-z0-9]*\).*#\1#p')"
          if [ -z "$SERVICE_ID" ]; then
            echo "::error::Could not read the service id (srv-...) out of RENDER_DEPLOY_HOOK_URL"
            exit 1
          fi

          # Describe the service before deploying to it. `imgURL` is only
          # meaningful for an image-backed service; pointed at a repo-backed one
          # the hook refuses with a bare 400 that reads like a broken URL. This
          # is reported, not enforced: the hook stays the authority on what it
          # accepts, and a wrong guess here must not block a working setup.
          # The HTTP status is read, not discarded: `jq` exits 0 on an error
          # payload as happily as on a service, and on empty input it exits 0
          # printing nothing — so a `|| echo` fallback never fires and a 401
          # renders as `type=?`, indistinguishable from a genuinely repo-backed
          # service. The hint at the bottom of the failure summary would then
          # send the reader off to re-create a service that was fine.
          SVC_BODY="$(mktemp)"
          SVC_CODE="$(curl -sS -o "$SVC_BODY" -w '%{http_code}' \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            "https://api.render.com/v1/services/${SERVICE_ID}" 2>/dev/null || true)"
          SVC_DESC=""
          case "$SVC_CODE" in
            2*)
              # A present `.type` is the proof this is a service and not an
              # error payload that happens to be valid JSON.
              if [ -n "$(jq -r '.type // empty' "$SVC_BODY" 2>/dev/null || true)" ]; then
                SVC_DESC="$(jq -r '"type=\(.type // "?") runtime=\(.serviceDetails.env // "?") image=\(.imageDetails.imagePath // "<none>") repo=\(.repo // "<none>")"' "$SVC_BODY" 2>/dev/null || true)"
              fi
              ;;
          esac
          SVC_DESC="${SVC_DESC:-could not describe service (HTTP ${SVC_CODE:-000})}"
          echo "Service ${SERVICE_ID}: ${SVC_DESC}"

          ENCODED="$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=""))' "$IMAGE_URL")"
          case "$HOOK" in
            *\?*) URL="${HOOK}&imgURL=${ENCODED}" ;;
            *) URL="${HOOK}?imgURL=${ENCODED}" ;;
          esac

          # Deliberately no `-f`: it makes curl exit non-zero and drop the body,
          # and the body is the only place Render says why it refused.
          BODY="$(mktemp)"
          # `|| true`, never `|| echo 000`: curl's `-w` already prints a status
          # and adds no trailing newline, so a fallback `echo` is glued onto it
          # instead of replacing it. A DNS failure would report `000000`, and a
          # transfer that dies after a good status would report `200000` — which
          # tests as `>= 300`, calling a deploy that Render *did* accept a
          # refusal and then never polling the rollout it just started.
          CODE="$(curl -sS -o "$BODY" -w '%{http_code}' -X POST "$URL" || true)"
          RESPONSE="$(cat "$BODY")"
          # curl prints nothing at all if it dies before write-out, and `[` on an
          # empty string is a bash error, not a failed comparison.
          case "$CODE" in
            ''|*[!0-9]*)
              echo "::error::curl returned no HTTP status for the deploy hook (got: '${CODE}')"
              exit 1
              ;;
          esac
          if [ "$CODE" -lt 200 ] || [ "$CODE" -ge 300 ]; then
            {
              echo "### Stage 4 failed — Render refused the deploy hook"
              echo
              echo "| | |"
              echo "|---|---|"
              echo "| HTTP | \`${CODE}\` |"
              echo "| service | \`${SERVICE_ID}\` — ${SVC_DESC} |"
              echo "| imgURL | \`${IMAGE_URL}\` |"
              echo
              echo "Render said:"
              echo
              echo '```'
              echo "${RESPONSE:-<empty body>}"
              echo '```'
              echo
              echo "A \`400\` with an image-backed \`imgURL\` usually means the service is not"
              echo "image-backed. The hook accepts \`imgURL\` only on a service created as"
              echo "*Deploy an existing image*."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Render deploy hook returned HTTP ${CODE}: ${RESPONSE:-<empty body>}"
            exit 1
          fi

          DEPLOY_ID="$(printf '%s' "$RESPONSE" | jq -r '.deploy.id // empty' 2>/dev/null || true)"
          if [ -z "$DEPLOY_ID" ]; then
            echo "::error::Render accepted the hook (HTTP ${CODE}) but returned no deploy id. Response: ${RESPONSE:-<empty body>}"
            exit 1
          fi

          {
            echo "deploy_id=$DEPLOY_ID"
            echo "service_id=$SERVICE_ID"
          } >> "$GITHUB_OUTPUT"
          echo "Queued Render deploy $DEPLOY_ID on $SERVICE_ID"

      - name: Wait for the deploy to go live
        id: rollout
        run: |
          set -euo pipefail
          API="https://api.render.com/v1/services/${{ steps.hook.outputs.service_id }}/deploys/${{ steps.hook.outputs.deploy_id }}"
          STATUS="unknown"
          i=1
          while [ "$i" -le 120 ]; do
            STATUS="$(curl -fsS \
              -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
              -H 'Accept: application/json' \
              "$API" | jq -r '.status // "unknown"')"
            case "$STATUS" in
              live)
                echo "status=live" >> "$GITHUB_OUTPUT"
                echo "Deploy is live after $i check(s)"
                exit 0
                ;;
              build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                echo "status=$STATUS" >> "$GITHUB_OUTPUT"
                echo "::error::Render deploy ended as '$STATUS' — the API did NOT roll out"
                exit 1
                ;;
              *)
                echo "check $i: $STATUS"
                ;;
            esac
            i=$((i + 1))
            sleep 15
          done
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "::error::Render deploy never reached 'live' (last status: $STATUS)"
          exit 1

      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### API rollout"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| deploy | \`${{ steps.hook.outputs.deploy_id }}\` |"
            echo "| service | \`${{ steps.hook.outputs.service_id }}\` |"
            echo "| status | **${{ steps.rollout.outputs.status || 'never started' }}** |"
          } >> "$GITHUB_STEP_SUMMARY"

  verify-api:
    name: 5 · Verify API
    needs: deploy-api
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      # Render already reported `live`; this proves the app answers, not just that
      # the container started.
      - name: Smoke health + ready
        run: |
          set -euo pipefail
          BASE="${{ secrets.RENDER_API_URL }}"
          BASE="${BASE%/}"
          smoke() {
            local path="$1"
            local i=1
            while [ "$i" -le 36 ]; do
              code="$(curl -sS -o /tmp/smoke-body -w '%{http_code}' "$BASE$path" || true)"
              if [ "$code" = "200" ]; then
                echo "OK $path ($code) after $i attempt(s)"
                return 0
              fi
              echo "attempt $i: $path → $code"
              i=$((i + 1))
              sleep 10
            done
            echo "::error::Smoke failed for $path"
            cat /tmp/smoke-body || true
            exit 1
          }
          smoke /v1/health
          smoke /v1/health/ready

  deploy-web:
    name: 6 · Deploy web (Vercel)
    needs: [resolve, verify-api]
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.commit }}

      # `package-manager-cache: false` is required: setup-node v5 reads the root
      # `packageManager` field on its own and shells out to `pnpm store path`,
      # and this job never installs pnpm.
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install Vercel CLI
        run: npm install --global vercel@41

      # Deployed from the repo root on purpose: the project's Root Directory
      # (apps/web) is applied on top of the uploaded source, and the pnpm
      # workspace needs the root lockfile and packages/ above apps/web.
      - name: Deploy Vercel (prod)
        run: |
          set -euo pipefail
          API_BASE="${{ secrets.RENDER_API_URL }}"
          API_BASE="${API_BASE%/}"
          export NEXT_PUBLIC_API_URL="${API_BASE}/v1"
          vercel deploy --prod --yes \
            --token="${{ secrets.VERCEL_TOKEN }}" \
            --build-env NEXT_PUBLIC_API_URL="$NEXT_PUBLIC_API_URL" \
            --env NEXT_PUBLIC_API_URL="$NEXT_PUBLIC_API_URL"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  verify-web:
    name: 7 · Verify web
    needs: deploy-web
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - name: Smoke web home
        run: |
          set -euo pipefail
          WEB="${{ secrets.VERCEL_WEB_URL }}"
          WEB="${WEB%/}"
          i=1
          while [ "$i" -le 18 ]; do
            code="$(curl -sS -o /tmp/web-body -w '%{http_code}' "$WEB/" || true)"
            if [ "$code" = "200" ]; then
              echo "OK web home ($code) after $i attempt(s)"
              exit 0
            fi
            echo "attempt $i: web → $code"
            i=$((i + 1))
            sleep 10
          done
          echo "::error::Smoke failed for web home"
          cat /tmp/web-body || true
          exit 1
