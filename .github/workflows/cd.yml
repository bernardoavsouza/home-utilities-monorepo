name: CD

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing git tag to redeploy (e.g. v1.2.3). Required for dispatch.
        required: true
        type: string

concurrency:
  group: cd-${{ github.workflow }}-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/bernardoavsouza/home-utilities-api

jobs:
  resolve:
    name: 1 · Resolve tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      commit: ${{ steps.meta.outputs.commit }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image_sha: ${{ steps.meta.outputs.image_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: meta
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          case "$TAG" in
            v*) ;;
            *)
              echo "::error::Tag must match v* (got: $TAG)"
              exit 1
              ;;
          esac
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            git fetch origin "refs/tags/$TAG:refs/tags/$TAG"
          fi
          COMMIT="$(git rev-list -n 1 "$TAG")"
          SHORT_SHA="$(git rev-parse --short=7 "$COMMIT")"
          {
            echo "tag=$TAG"
            echo "commit=$COMMIT"
            echo "short_sha=$SHORT_SHA"
            echo "image_tag=${IMAGE_NAME}:$TAG"
            echo "image_sha=${IMAGE_NAME}:sha-$SHORT_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Assert tag commit is on origin/main
        run: |
          set -euo pipefail
          git fetch origin main
          if ! git merge-base --is-ancestor "${{ steps.meta.outputs.commit }}" origin/main; then
            echo "::error::Commit ${{ steps.meta.outputs.commit }} (tag ${{ steps.meta.outputs.tag }}) is not on origin/main"
            exit 1
          fi

      - name: Summary
        run: |
          {
            echo "### Deploying \`${{ steps.meta.outputs.tag }}\`"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| commit | \`${{ steps.meta.outputs.short_sha }}\` |"
            echo "| image | \`${{ steps.meta.outputs.image_tag }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  image:
    name: API 1 · Build & push image
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ needs.resolve.outputs.image_tag }}
            ${{ needs.resolve.outputs.image_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  migrate:
    name: API 2 · Migrate database
    needs: [resolve, image]
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prisma migrate deploy
        run: |
          set -euo pipefail
          docker run --rm \
            -e DATABASE_URL \
            "${{ needs.resolve.outputs.image_tag }}" \
            ./node_modules/.bin/prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  deploy-api:
    name: API 3 · Deploy (Render)
    needs: [resolve, migrate]
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 40
    steps:
      - name: Trigger Render deploy
        id: hook
        run: |
          set -euo pipefail
          IMAGE_URL="${{ needs.resolve.outputs.image_tag }}"
          HOOK="${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

          SERVICE_ID="$(printf '%s' "$HOOK" | sed -n 's#.*/deploy/\(srv-[A-Za-z0-9]*\).*#\1#p')"
          if [ -z "$SERVICE_ID" ]; then
            echo "::error::Could not read the service id (srv-...) out of RENDER_DEPLOY_HOOK_URL"
            exit 1
          fi

          SVC_BODY="$(mktemp)"
          SVC_CODE="$(curl -sS -o "$SVC_BODY" -w '%{http_code}' \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            "https://api.render.com/v1/services/${SERVICE_ID}" 2>/dev/null || true)"
          SVC_DESC=""
          case "$SVC_CODE" in
            2*)
              if [ -n "$(jq -r '.type // empty' "$SVC_BODY" 2>/dev/null || true)" ]; then
                SVC_DESC="$(jq -r '"type=\(.type // "?") runtime=\(.serviceDetails.env // "?") image=\(.imageDetails.imagePath // "<none>") repo=\(.repo // "<none>")"' "$SVC_BODY" 2>/dev/null || true)"
              fi
              ;;
          esac
          SVC_DESC="${SVC_DESC:-could not describe service (HTTP ${SVC_CODE:-000})}"
          echo "Service ${SERVICE_ID}: ${SVC_DESC}"

          ENCODED="$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=""))' "$IMAGE_URL")"
          case "$HOOK" in
            *\?*) URL="${HOOK}&imgURL=${ENCODED}" ;;
            *) URL="${HOOK}?imgURL=${ENCODED}" ;;
          esac

          BODY="$(mktemp)"
          CODE="$(curl -sS -o "$BODY" -w '%{http_code}' -X POST "$URL" || true)"
          RESPONSE="$(cat "$BODY")"
          case "$CODE" in
            ''|*[!0-9]*)
              echo "::error::curl returned no HTTP status for the deploy hook (got: '${CODE}')"
              exit 1
              ;;
          esac
          if [ "$CODE" -lt 200 ] || [ "$CODE" -ge 300 ]; then
            {
              echo "### API deploy failed — Render refused the deploy hook"
              echo
              echo "| | |"
              echo "|---|---|"
              echo "| HTTP | \`${CODE}\` |"
              echo "| service | \`${SERVICE_ID}\` — ${SVC_DESC} |"
              echo "| imgURL | \`${IMAGE_URL}\` |"
              echo
              echo "Render said:"
              echo
              echo '```'
              echo "${RESPONSE:-<empty body>}"
              echo '```'
              echo
              echo "A \`400\` with an image-backed \`imgURL\` usually means the service is not"
              echo "image-backed. The hook accepts \`imgURL\` only on a service created as"
              echo "*Deploy an existing image*."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Render deploy hook returned HTTP ${CODE}: ${RESPONSE:-<empty body>}"
            exit 1
          fi

          DEPLOY_ID="$(printf '%s' "$RESPONSE" | jq -r '.deploy.id // empty' 2>/dev/null || true)"
          if [ -z "$DEPLOY_ID" ]; then
            echo "::error::Render accepted the hook (HTTP ${CODE}) but returned no deploy id. Response: ${RESPONSE:-<empty body>}"
            exit 1
          fi

          {
            echo "deploy_id=$DEPLOY_ID"
            echo "service_id=$SERVICE_ID"
          } >> "$GITHUB_OUTPUT"
          echo "Queued Render deploy $DEPLOY_ID on $SERVICE_ID"

      - name: Wait for the deploy to go live
        id: rollout
        run: |
          set -euo pipefail
          API="https://api.render.com/v1/services/${{ steps.hook.outputs.service_id }}/deploys/${{ steps.hook.outputs.deploy_id }}"
          STATUS="unknown"
          i=1
          while [ "$i" -le 120 ]; do
            STATUS="$(curl -fsS \
              -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
              -H 'Accept: application/json' \
              "$API" | jq -r '.status // "unknown"')"
            case "$STATUS" in
              live)
                echo "status=live" >> "$GITHUB_OUTPUT"
                echo "Deploy is live after $i check(s)"
                exit 0
                ;;
              build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                echo "status=$STATUS" >> "$GITHUB_OUTPUT"
                echo "::error::Render deploy ended as '$STATUS' — the API did NOT roll out"
                exit 1
                ;;
              *)
                echo "check $i: $STATUS"
                ;;
            esac
            i=$((i + 1))
            sleep 15
          done
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "::error::Render deploy never reached 'live' (last status: $STATUS)"
          exit 1

      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### API rollout"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| deploy | \`${{ steps.hook.outputs.deploy_id }}\` |"
            echo "| service | \`${{ steps.hook.outputs.service_id }}\` |"
            echo "| status | **${{ steps.rollout.outputs.status || 'never started' }}** |"
          } >> "$GITHUB_STEP_SUMMARY"

  verify-api:
    name: API 4 · Verify
    needs: deploy-api
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - name: Smoke health + ready
        run: |
          set -euo pipefail
          BASE="${{ secrets.RENDER_API_URL }}"
          BASE="${BASE%/}"
          smoke() {
            local path="$1"
            local i=1
            while [ "$i" -le 36 ]; do
              code="$(curl -sS -o /tmp/smoke-body -w '%{http_code}' "$BASE$path" || true)"
              if [ "$code" = "200" ]; then
                echo "OK $path ($code) after $i attempt(s)"
                return 0
              fi
              echo "attempt $i: $path → $code"
              i=$((i + 1))
              sleep 10
            done
            echo "::error::Smoke failed for $path"
            cat /tmp/smoke-body || true
            exit 1
          }
          smoke /v1/health
          smoke /v1/health/ready

  deploy-web:
    name: Web 1 · Deploy (Vercel)
    needs: resolve
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.commit }}

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Preflight Vercel scope
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail

          req() {
            curl -sS -o "$1" -w '%{http_code}' \
              -H "Authorization: Bearer ${VERCEL_TOKEN}" \
              -H 'Accept: application/json' \
              "https://api.vercel.com$2" 2>/dev/null || true
          }

          CODE="$(req /tmp/vc-user /v2/user)"
          case "$CODE" in
            2*) ;;
            *)
              echo "::error::VERCEL_TOKEN is not usable (GET /v2/user → HTTP ${CODE:-000}). $(cat /tmp/vc-user 2>/dev/null)"
              exit 1
              ;;
          esac
          USER_ID="$(jq -r '.user.id // .id // "?"' /tmp/vc-user)"
          USER_NAME="$(jq -r '.user.username // .username // "?"' /tmp/vc-user)"
          echo "token belongs to user ${USER_NAME} (id ${USER_ID})"

          shape() {
            case "$1" in
              "$2"*) echo "${#1} chars, starts with '$2'" ;;
              *) echo "${#1} chars, no '$2' prefix" ;;
            esac
          }
          echo "VERCEL_ORG_ID: $(shape "$VERCEL_ORG_ID" team_) — expected only for a team; a personal account's org id is unprefixed"
          echo "VERCEL_PROJECT_ID: $(shape "$VERCEL_PROJECT_ID" prj_)"

          CODE="$(req /tmp/vc-teams '/v2/teams?limit=100')"
          echo "teams the token can see:"
          case "$CODE" in
            2*) ;;
            *) echo "  (could not list teams — HTTP ${CODE:-000})" ;;
          esac
          for T in $(jq -r '.teams[]?.id' /tmp/vc-teams 2>/dev/null); do
            if [ "$T" = "$VERCEL_ORG_ID" ]; then
              REL="matches VERCEL_ORG_ID exactly"
            elif [ "${T#"$VERCEL_ORG_ID"}" != "$T" ] && [ -n "$VERCEL_ORG_ID" ]; then
              REL="VERCEL_ORG_ID is this id truncated — append '${T#"$VERCEL_ORG_ID"}' to it ($(( ${#T} - ${#VERCEL_ORG_ID} )) char(s) missing from the end)"
            else
              REL="unrelated to VERCEL_ORG_ID (${#T} chars vs ${#VERCEL_ORG_ID})"
            fi
            echo "  - team ${#T} chars — ${REL}"
            if [ "$(req /tmp/vc-list "/v9/projects?teamId=${T}&limit=100")" = "200" ]; then
              jq -r '.projects[]? | "      · \(.name)  \(.id)"' /tmp/vc-list || true
            else
              echo "      (cannot list this team's projects with this token)"
            fi
          done

          CODE="$(req /tmp/vc-proj "/v9/projects/${VERCEL_PROJECT_ID}?teamId=${VERCEL_ORG_ID}")"
          case "$CODE" in
            2*)
              echo "project resolves: $(jq -r '.name // "?"' /tmp/vc-proj)"
              exit 0
              ;;
          esac
          echo "project did NOT resolve under VERCEL_ORG_ID (HTTP ${CODE:-000}): $(cat /tmp/vc-proj 2>/dev/null)"

          OWNER=""
          if [ "$(req /tmp/vc-try "/v9/projects/${VERCEL_PROJECT_ID}")" = "200" ]; then
            OWNER="the personal account ${USER_NAME} — set VERCEL_ORG_ID to ${USER_ID}"
          else
            for T in $(jq -r '.teams[]?.id' /tmp/vc-teams 2>/dev/null); do
              if [ "$(req /tmp/vc-try "/v9/projects/${VERCEL_PROJECT_ID}?teamId=${T}")" = "200" ]; then
                OWNER="a team the token can reach — set VERCEL_ORG_ID to ${T}"
                break
              fi
            done
          fi
          echo "owner search: ${OWNER:-not found under any account this token can reach}"

          {
            echo "### Web deploy failed — Vercel could not resolve the project"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| token | valid, belongs to \`${USER_NAME}\` |"
            echo "| project under \`VERCEL_ORG_ID\` | HTTP \`${CODE:-000}\` |"
            if [ -n "$OWNER" ]; then
              echo "| actually owned by | ${OWNER} |"
            else
              echo "| actually owned by | not found under any account this token can reach |"
            fi
            echo
            if [ -n "$OWNER" ]; then
              echo "\`VERCEL_PROJECT_ID\` is right, but \`VERCEL_ORG_ID\` points at the wrong account."
            else
              echo "Either \`VERCEL_PROJECT_ID\` is not this project's id — copy it from Project →"
              echo "Settings → General → Project ID, where it normally reads \`prj_…\` — or the token"
              echo "is scoped to an account that cannot see it. A token's *scope* is chosen when it"
              echo "is created and is separate from its access level, so a full-access token scoped"
              echo "to your personal account still cannot read a team's projects."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Vercel could not resolve VERCEL_PROJECT_ID under VERCEL_ORG_ID (HTTP ${CODE:-000})"
          exit 1

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy Vercel (prod)
        run: |
          set -euo pipefail
          API_BASE="${{ secrets.RENDER_API_URL }}"
          API_BASE="${API_BASE%/}"
          export NEXT_PUBLIC_API_URL="${API_BASE}/v1"
          vercel deploy --prod --yes \
            --token="${{ secrets.VERCEL_TOKEN }}" \
            --build-env NEXT_PUBLIC_API_URL="$NEXT_PUBLIC_API_URL" \
            --env NEXT_PUBLIC_API_URL="$NEXT_PUBLIC_API_URL"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  verify-web:
    name: Web 2 · Verify
    needs: deploy-web
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - name: Smoke web home
        run: |
          set -euo pipefail
          WEB="${{ secrets.VERCEL_WEB_URL }}"
          WEB="${WEB%/}"
          i=1
          while [ "$i" -le 18 ]; do
            code="$(curl -sS -o /tmp/web-body -w '%{http_code}' "$WEB/" || true)"
            if [ "$code" = "200" ]; then
              echo "OK web home ($code) after $i attempt(s)"
              exit 0
            fi
            echo "attempt $i: web → $code"
            i=$((i + 1))
            sleep 10
          done
          echo "::error::Smoke failed for web home"
          cat /tmp/web-body || true
          exit 1

  release:
    name: Release · Both apps live
    needs: [resolve, verify-api, verify-web]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Summary
        run: |
          {
            echo "### \`${{ needs.resolve.outputs.tag }}\` shipped"
            echo
            echo "| track | |"
            echo "|---|---|"
            echo "| API | image \`${{ needs.resolve.outputs.image_tag }}\` rolled out and smoked |"
            echo "| web | deployed from \`${{ needs.resolve.outputs.short_sha }}\` and smoked |"
          } >> "$GITHUB_STEP_SUMMARY"
