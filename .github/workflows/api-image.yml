name: API image

# Pull requests targeting main only — there is no push trigger.
on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Nothing is pushed — this only keeps the Dockerfile from rotting.
jobs:
  image:
    name: api · docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: monorepo-boilerplate-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
