name: Web image

# Pull requests targeting main only — there is no push trigger.
on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Nothing is pushed — this only keeps the Dockerfile from rotting.
jobs:
  image:
    name: web · docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      # NEXT_PUBLIC_API_URL is a build arg because Next inlines it into the client
      # bundle; the value here only has to be well-formed, never reachable.
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: monorepo-boilerplate-web:ci
          build-args: |
            NEXT_PUBLIC_API_URL=http://127.0.0.1:3001/v1
          cache-from: type=gha
          cache-to: type=gha,mode=max
