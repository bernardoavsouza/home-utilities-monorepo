name: API tests

# Pull requests targeting main only — there is no push trigger.
on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: api · vitest
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://app:app@localhost:5432/app_test?schema=public
      ENVIRONMENT: TEST
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      - name: Prisma generate
        run: pnpm prisma:generate

      # Only the test database: `db:migrate` at the root also targets `app`,
      # which does not exist in CI. The committed .env.test points here too.
      - name: Migrate test database
        run: pnpm --filter api db:migrate:test

      - name: Test
        run: pnpm exec turbo run test --filter=api
