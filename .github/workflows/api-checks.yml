name: API checks

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: api · lint · typecheck · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      - name: Prisma generate
        run: pnpm prisma:generate

      - name: Lint
        run: pnpm exec turbo run lint --filter=api

      - name: Typecheck
        run: pnpm exec turbo run typecheck --filter=api

      - name: Build
        run: pnpm exec turbo run build --filter=api
