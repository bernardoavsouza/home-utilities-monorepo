name: Web checks

# Pull requests targeting main only — there is no push trigger.
on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: web · lint · typecheck · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      # `--filter=web` keeps the task graph, so `@packages/contracts#typecheck`
      # still runs as an upstream dependency — contracts needs no workflow of its own.
      - name: Lint
        run: pnpm exec turbo run lint --filter=web

      # `typecheck` is `next typegen && tsc`: plain tsc fails on a clean checkout
      # because the generated route types aren't there yet.
      - name: Typecheck
        run: pnpm exec turbo run typecheck --filter=web

      - name: Build
        run: pnpm exec turbo run build --filter=web
