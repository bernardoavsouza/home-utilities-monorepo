name: CD · API

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing git tag to redeploy (e.g. v1.2.3). Required for dispatch.
        required: true
        type: string

concurrency:
  group: cd-api-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/bernardoavsouza/home-utilities-api

jobs:
  resolve:
    name: 1 · Resolve tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      commit: ${{ steps.resolve.outputs.commit }}
      short_sha: ${{ steps.resolve.outputs.short_sha }}
      image_tag: ${{ steps.names.outputs.image_tag }}
      image_sha: ${{ steps.names.outputs.image_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: resolve
        uses: ./.github/actions/resolve-tag
        with:
          tag: ${{ github.event.inputs.tag }}

      - name: Name the images
        id: names
        run: |
          set -euo pipefail
          {
            echo "image_tag=${IMAGE_NAME}:${{ steps.resolve.outputs.tag }}"
            echo "image_sha=${IMAGE_NAME}:sha-${{ steps.resolve.outputs.short_sha }}"
          } >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          {
            echo "### Deploying API \`${{ steps.resolve.outputs.tag }}\`"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| commit | \`${{ steps.resolve.outputs.short_sha }}\` |"
            echo "| image | \`${{ steps.names.outputs.image_tag }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  image:
    name: 2 · Build & push image
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ needs.resolve.outputs.image_tag }}
            ${{ needs.resolve.outputs.image_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  migrate:
    name: 3 · Migrate database
    needs: [resolve, image]
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prisma migrate deploy
        run: |
          set -euo pipefail
          docker run --rm \
            -e DATABASE_URL \
            "${{ needs.resolve.outputs.image_tag }}" \
            ./node_modules/.bin/prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  deploy:
    name: 4 · Deploy (Render)
    needs: [resolve, migrate]
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 40
    steps:
      - name: Trigger Render deploy
        id: hook
        run: |
          set -euo pipefail
          IMAGE_URL="${{ needs.resolve.outputs.image_tag }}"
          HOOK="${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

          SERVICE_ID="$(printf '%s' "$HOOK" | sed -n 's#.*/deploy/\(srv-[A-Za-z0-9]*\).*#\1#p')"
          if [ -z "$SERVICE_ID" ]; then
            echo "::error::Could not read the service id (srv-...) out of RENDER_DEPLOY_HOOK_URL"
            exit 1
          fi

          SVC_BODY="$(mktemp)"
          SVC_CODE="$(curl -sS -o "$SVC_BODY" -w '%{http_code}' \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            "https://api.render.com/v1/services/${SERVICE_ID}" 2>/dev/null || true)"
          SVC_DESC=""
          case "$SVC_CODE" in
            2*)
              if [ -n "$(jq -r '.type // empty' "$SVC_BODY" 2>/dev/null || true)" ]; then
                SVC_DESC="$(jq -r '"type=\(.type // "?") runtime=\(.serviceDetails.env // "?") image=\(.imageDetails.imagePath // "<none>") repo=\(.repo // "<none>")"' "$SVC_BODY" 2>/dev/null || true)"
              fi
              ;;
          esac
          SVC_DESC="${SVC_DESC:-could not describe service (HTTP ${SVC_CODE:-000})}"
          echo "Service ${SERVICE_ID}: ${SVC_DESC}"

          ENCODED="$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=""))' "$IMAGE_URL")"
          case "$HOOK" in
            *\?*) URL="${HOOK}&imgURL=${ENCODED}" ;;
            *) URL="${HOOK}?imgURL=${ENCODED}" ;;
          esac

          BODY="$(mktemp)"
          CODE="$(curl -sS -o "$BODY" -w '%{http_code}' -X POST "$URL" || true)"
          RESPONSE="$(cat "$BODY")"
          case "$CODE" in
            ''|*[!0-9]*)
              echo "::error::curl returned no HTTP status for the deploy hook (got: '${CODE}')"
              exit 1
              ;;
          esac
          if [ "$CODE" -lt 200 ] || [ "$CODE" -ge 300 ]; then
            {
              echo "### API deploy failed — Render refused the deploy hook"
              echo
              echo "| | |"
              echo "|---|---|"
              echo "| HTTP | \`${CODE}\` |"
              echo "| service | \`${SERVICE_ID}\` — ${SVC_DESC} |"
              echo "| imgURL | \`${IMAGE_URL}\` |"
              echo
              echo "Render said:"
              echo
              echo '```'
              echo "${RESPONSE:-<empty body>}"
              echo '```'
              echo
              echo "A \`400\` with an image-backed \`imgURL\` usually means the service is not"
              echo "image-backed. The hook accepts \`imgURL\` only on a service created as"
              echo "*Deploy an existing image*."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Render deploy hook returned HTTP ${CODE}: ${RESPONSE:-<empty body>}"
            exit 1
          fi

          DEPLOY_ID="$(printf '%s' "$RESPONSE" | jq -r '.deploy.id // empty' 2>/dev/null || true)"
          if [ -z "$DEPLOY_ID" ]; then
            echo "::error::Render accepted the hook (HTTP ${CODE}) but returned no deploy id. Response: ${RESPONSE:-<empty body>}"
            exit 1
          fi

          {
            echo "deploy_id=$DEPLOY_ID"
            echo "service_id=$SERVICE_ID"
          } >> "$GITHUB_OUTPUT"
          echo "Queued Render deploy $DEPLOY_ID on $SERVICE_ID"

      - name: Wait for the deploy to go live
        id: rollout
        run: |
          set -euo pipefail
          API="https://api.render.com/v1/services/${{ steps.hook.outputs.service_id }}/deploys/${{ steps.hook.outputs.deploy_id }}"
          STATUS="unknown"
          i=1
          while [ "$i" -le 120 ]; do
            STATUS="$(curl -fsS \
              -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
              -H 'Accept: application/json' \
              "$API" | jq -r '.status // "unknown"')"
            case "$STATUS" in
              live)
                echo "status=live" >> "$GITHUB_OUTPUT"
                echo "Deploy is live after $i check(s)"
                exit 0
                ;;
              build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                echo "status=$STATUS" >> "$GITHUB_OUTPUT"
                echo "::error::Render deploy ended as '$STATUS' — the API did NOT roll out"
                exit 1
                ;;
              *)
                echo "check $i: $STATUS"
                ;;
            esac
            i=$((i + 1))
            sleep 15
          done
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "::error::Render deploy never reached 'live' (last status: $STATUS)"
          exit 1

      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### API rollout"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| deploy | \`${{ steps.hook.outputs.deploy_id }}\` |"
            echo "| service | \`${{ steps.hook.outputs.service_id }}\` |"
            echo "| status | **${{ steps.rollout.outputs.status || 'never started' }}** |"
          } >> "$GITHUB_STEP_SUMMARY"

  verify:
    name: 5 · Verify
    needs: deploy
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - name: Smoke health + ready
        run: |
          set -euo pipefail
          BASE="${{ secrets.RENDER_API_URL }}"
          BASE="${BASE%/}"
          smoke() {
            local path="$1"
            local i=1
            while [ "$i" -le 36 ]; do
              code="$(curl -sS -o /tmp/smoke-body -w '%{http_code}' "$BASE$path" || true)"
              if [ "$code" = "200" ]; then
                echo "OK $path ($code) after $i attempt(s)"
                return 0
              fi
              echo "attempt $i: $path → $code"
              i=$((i + 1))
              sleep 10
            done
            echo "::error::Smoke failed for $path"
            cat /tmp/smoke-body || true
            exit 1
          }
          smoke /v1/health
          smoke /v1/health/ready
